<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Prompt</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #fce4ec;
      --bg-end: #f8bbd0;
      --card: #ffffff;
      --text: #3a3a3a;
      --accent: #e91e63;
      --accent-dark: #c2185b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
    }

    .card {
      width: min(90vw, 420px);
      background: var(--card);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0 0 24px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      position: relative;
      height: 52px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:focus-visible {
      outline: 3px solid rgba(233, 30, 99, 0.4);
      outline-offset: 2px;
    }

    #yesBtn {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 18px rgba(233, 30, 99, 0.35);
    }

    #yesBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(233, 30, 99, 0.4);
    }

    #noBtn {
      background: #f3f3f3;
      color: #6b6b6b;
      position: absolute;
      left: 50%;
      transform: translateX(40px);
      transition: left 0.2s ease, top 0.2s ease;
    }

    #noBtn:hover {
      transform: translateX(40px) scale(1.02);
    }

    .thanks {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 16px;
      background: #fff0f6;
      color: var(--accent-dark);
      font-weight: 600;
      box-shadow: inset 0 0 0 2px rgba(233, 30, 99, 0.2);
      display: none;
    }

    .thanks.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my valentine?</h1>
    <div class="buttons" id="buttonArea">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
    <div class="thanks" id="thanksBox">Thank you! 💖</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const buttonArea = document.getElementById('buttonArea');
    const yesBtn = document.getElementById('yesBtn');
    const thanksBox = document.getElementById('thanksBox');

    const moveNoButton = () => {
      const areaRect = buttonArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();
      const maxLeft = areaRect.width - btnRect.width;
      const maxTop = areaRect.height - btnRect.height;

      const randLeft = Math.random() * maxLeft;
      const randTop = Math.random() * maxTop;

      noBtn.style.left = `${randLeft}px`;
      noBtn.style.top = `${randTop}px`;
    };

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);

    yesBtn.addEventListener('click', () => {
      thanksBox.classList.add('show');
    });
  </script>
</body>
</html>
